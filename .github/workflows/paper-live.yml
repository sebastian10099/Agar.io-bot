name: Paper-Live (echter Markt, Spielgeld)

# The real bot in paper mode against the live markets for a few hours. Every
# two minutes a read-only snapshot (index.html, REPORT.md, state.json) goes to
# the branch paper-live, together with the paper account (bot.sqlite.gz), so
# the next run continues the same account. Start: change .github/paper-live.json
# on the bot's branch, or "Run workflow" once the file is on the default branch.

on:
  push:
    branches: [claude/agenen-funktionalitaet-hnw6g5]
    paths: ['.github/paper-live.json', '.github/workflows/paper-live.yml']
  workflow_dispatch:
    inputs:
      hours:
        description: 'Laufzeit in Stunden (höchstens 5.5)'
        default: '5'

permissions:
  contents: write          # only to publish the snapshot branch paper-live

concurrency:
  group: paper-live
  cancel-in-progress: true # a new start replaces the running one; the account is saved on the way out

jobs:
  paper:
    name: Paper-Live – Spielgeld gegen echte Kurse
    runs-on: macos-14
    timeout-minutes: 350
    env:
      PAGES_URL: https://sebastian10099.github.io/Agar.io-bot/
    steps:
      - uses: actions/checkout@v5
      - name: Paper-Konto vom letzten Lauf holen
        run: |
          # the runner context exists only inside steps: paths go through GITHUB_ENV
          echo "NEW_TOKEN_BOT_HOME=$RUNNER_TEMP/paper" >> "$GITHUB_ENV"
          echo "SITE=$RUNNER_TEMP/site" >> "$GITHUB_ENV"
          NEW_TOKEN_BOT_HOME="$RUNNER_TEMP/paper"; SITE="$RUNNER_TEMP/site"
          mkdir -p "$NEW_TOKEN_BOT_HOME" "$SITE"
          if git fetch -q --depth 1 origin paper-live 2>/dev/null && git show origin/paper-live:bot.sqlite.gz > "$RUNNER_TEMP/bot.sqlite.gz" 2>/dev/null; then
            gunzip -c "$RUNNER_TEMP/bot.sqlite.gz" > "$NEW_TOKEN_BOT_HOME/bot.sqlite"
            echo "Paper-Konto vom letzten Lauf fortgesetzt"
            # a new "reset" mark in .github/paper-live.json starts the paper book afresh, once: positions,
            # fills and ticks go, the judged tokens and their measured outcomes (the edge data) stay
            (cd trading-bot && python3 - "$NEW_TOKEN_BOT_HOME/bot.sqlite" <<'PY'
          import json, sys
          from bot.store import Store
          mark = json.load(open("../.github/paper-live.json")).get("reset")
          store = Store(sys.argv[1])
          if mark and store.get("paper_live_reset") != mark:
              store.reset("positions")
              store.set("paper_live_reset", mark)
              store.log("info", f"Paper-Live: Konto neu begonnen ({mark}), Kandidaten und Ergebnisse bleiben")
              print(f"Paper-Konto neu begonnen ({mark}) – Kandidaten und Ergebnisse bleiben")
          store.close()
          PY
            )
          else
            echo "Erster Lauf: neues Paper-Konto mit 1.000 $ Spielgeld"
          fi
      - name: Bot laufen lassen, alle 2 Minuten veröffentlichen
        working-directory: trading-bot
        env:
          HOURS: ${{ inputs.hours }}
          GH_TOKEN: ${{ github.token }}
        run: |
          HOURS="${HOURS:-$(python3 -c "import json; print(json.load(open('../.github/paper-live.json')).get('hours', 5))")}"
          END=$(python3 -c "import time; print(int(time.time() + min(5.5, float('$HOURS')) * 3600))")
          # a filter profile from .github/paper-live.json ("profile": a name from bot/presets.json) becomes the run's config
          python3 - "$NEW_TOKEN_BOT_HOME/config.json" <<'PY'
          import json, sys
          run = json.load(open("../.github/paper-live.json"))
          name = run.get("profile")
          cfg = {}
          for path, value in (json.load(open("bot/presets.json"))[name] if name else {}).items():
              head, _, key = path.rpartition(".")
              (cfg.setdefault(head, {}) if head else cfg)[key] = value
          # "config" in paper-live.json: settings only this paper run uses (e.g. a looser daily limit,
          # so a bad hour does not stop the data); the same keys as bot/config.json
          for key, value in (run.get("config") or {}).items():
              if isinstance(value, dict):
                  cfg.setdefault(key, {}).update(value)
              else:
                  cfg[key] = value
          json.dump(cfg, open(sys.argv[1], "w"), ensure_ascii=False, indent=2)
          print(f"Profil: {name or 'Standard'}" + (f" · eigene Werte: {run['config']}" if run.get("config") else ""))
          PY
          /bin/bash ./launch.sh --no-open --port 8765 > "$RUNNER_TEMP/bot.out" 2>&1 &
          for _ in $(seq 1 120); do curl -s -m 2 http://127.0.0.1:8765/api/state | grep -q '"app": "new-token-bot"' && break; sleep 1; done
          head -20 "$RUNNER_TEMP/bot.out"

          save_account() {   # consistent, compacted copy of the running database (GitHub refuses files over 100 MB)
            python3 tools/snapshot_db.py "$NEW_TOKEN_BOT_HOME/bot.sqlite" "$SITE/bot.sqlite.gz" || echo "Konto sichern fehlgeschlagen"
          }
          publish() {        # one commit, force-pushed: the branch holds only the latest snapshot
            python3 tools/paper_live.py http://127.0.0.1:8765 "$SITE" "$PAGES_URL" || echo "Schnappschuss fehlgeschlagen"
            # runtime audit of this run against its own rules, shown in the report
            if ! python3 tools/audit.py "$NEW_TOKEN_BOT_HOME" "$SITE/state.json" --since-start > "$SITE/audit.txt" 2>&1; then
              echo "Laufzeit-Prüfung: Befund"; cat "$SITE/audit.txt"
            fi
            { echo; echo "## Laufzeit-Prüfung dieses Laufs"; echo; echo '```'; cat "$SITE/audit.txt"; echo '```'; } >> "$SITE/REPORT.md"
            if [ -s "$SITE/backtest.txt" ]; then
              { echo; echo "## Backtest auf den Kursverläufen"; echo; echo '```'; cat "$SITE/backtest.txt"; echo '```'; } >> "$SITE/REPORT.md"
            fi
            touch "$SITE/.nojekyll"
            # one parentless commit, force-pushed: the branch holds only the latest snapshot. The local repository
            # stays, so git knows what the remote already has and does not upload the unchanged database again.
            (cd "$SITE" && { [ -d .git ] || { git init -q -b paper-live \
                && git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"; }; } \
              && git checkout -q --orphan next && git add -A \
              && git -c user.name="paper-live" -c user.email="paper-live@users.noreply.github.com" commit -q -m "Paper-Live $(date -u +%FT%TZ)" \
              && git branch -M next paper-live && git push -q -f origin paper-live) || echo "Veröffentlichen fehlgeschlagen"
          }
          finish() {
            echo "Ende: Konto sichern und letzten Schnappschuss veröffentlichen"
            save_account; publish
            curl -s -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8765/api/quit > /dev/null || true
            exit 0
          }
          trap finish INT TERM

          n=0
          while [ "$(date +%s)" -lt "$END" ]; do
            if [ $((n % 15)) -eq 0 ]; then                # the account every 30 minutes (and at the end)
              save_account
            fi
            if [ $((n % 5)) -eq 0 ]; then                 # the backtest every 10 minutes
              perl -e 'alarm 120; exec @ARGV' python3 tools/backtest.py "$NEW_TOKEN_BOT_HOME" --search > "$SITE/backtest.txt.new" 2>&1 \
                && mv "$SITE/backtest.txt.new" "$SITE/backtest.txt" || echo "Backtest fehlgeschlagen"
            fi
            publish
            if [ $((n % 5)) -eq 0 ]; then                  # a status line in the job log every 10 minutes
              python3 -c "import json,sys; s=json.load(open('$SITE/state.json')); print(f\"{s['polls']} Polls · Bankroll \${s['bankroll']:.2f} · offen {len(s['open_positions'])} · Trades {s['stats']['closed']} · Kandidaten {s['stats']['candidates']}\")" || true
              tail -1 "$SITE/audit.txt" || true
            fi
            n=$((n + 1))
            sleep 120 & wait $!                            # wait in the background, so a cancel reaches the trap at once
          done
          finish
