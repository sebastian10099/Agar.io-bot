              for c in [c for c in cands if c["snapshot"].get("liquidity_kind") == kind][:3]:
                  r = eng.open_from_candidate(c["id"])
                  print(f"Testkauf {c['symbol']} ({c['snapshot'].get('dex')}, {kind}): {'ok' if r['ok'] else r['error']}")
                  if r["ok"]:
                      break
          eng.store.close()
          PY
          sleep 15
          /bin/bash ./launch.sh --once       # the second poll prices what was bought
          echo "--- Warum fällt was durch (echte Marktdaten):"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from bot.store import Store
          s = Store(Path(os.environ["NEW_TOKEN_BOT_HOME"]) / "bot.sqlite")
          w = s.skip_reasons()
          print(json.dumps(w["decisions"]))
          for r in w["reasons"]:
              print(f"{r['n']:4d}  {r['share'] * 100:5.1f} %  {r['label']}")
          import statistics
          by = {}
          for c in s.candidates(500):
              by.setdefault(c["snapshot"].get("source") or "?", []).append(c)
          print("--- nach Quelle (Median):")
          for src, cs in sorted(by.items()):
              med = lambda k: statistics.median([float(c["snapshot"].get(k) or 0) for c in cs])
              liq_fail = sum(1 for c in cs if any("liquidity $" in r or "liquidity unknown" in r for r in c["reasons"]))
              kinds = {}
              for c in cs:
                  kinds[c["snapshot"].get("liquidity_kind")] = kinds.get(c["snapshot"].get("liquidity_kind"), 0) + 1
              dexes = sorted({str(c["snapshot"].get("dex")) for c in cs})
              print(f"  {src:14s} n={len(cs):3d}  Liq ${med('liquidity_usd'):,.0f}  Vol5m ${med('volume_m5'):,.0f}  Käufe5m {med('buys_m5'):.0f}  Alter {med('age_min'):.0f} min  an Liquidität gescheitert {liq_fail}  Liquidität: {kinds}  Dex: {', '.join(dexes)[:80]}")
          for c in [c for c in by.get("pumpfun", [])][:5]:
              sn = c["snapshot"]
              print(f"    pump.fun-Beispiel {c['symbol']!s:10.10s} dex={sn.get('dex')} liq={sn.get('liquidity_usd')} vol5m={sn.get('volume_m5')} buys5m={sn.get('buys_m5')} alter={sn.get('age_min')}")
          for c in [c for c in s.candidates(500) if c["snapshot"].get("liquidity_kind") in ("curve", "graduated")][:6]:
              sn = c["snapshot"]
              print(f"    Kurve {c['symbol']!s:10.10s} {sn.get('dex')} Liquidität ${sn.get('liquidity_usd'):,.0f} ({sn.get('liquidity_kind')}) Vol5m ${sn.get('volume_m5'):,.0f} Käufe5m {sn.get('buys_m5')} → {c['decision']}: {'; '.join(c['reasons'][:2])}")
          for pos in s.open_positions() + s.closed_positions(20):
              ticks = s.ticks_for(pos["id"])
              print(f"  Position {pos['symbol']!s:10.10s} {pos['status']} Einstieg {pos['entry_price']:.3g} · {len(ticks)} Kurse, zuletzt {ticks[-1]['price']:.3g}" if ticks else f"  Position {pos['symbol']} ohne Kurs")
          for c in s.candidates(200):
              if c["decision"] != "skip":
                  rug = (c["snapshot"].get("rug") or {})
                  print(f"  {c['decision']:5s} {c['symbol']!s:12.12s} score {c['score']}  Sicherheit: {rug.get('source', 'keine')}  {'; '.join(c['reasons'][:3])}")
          PY
