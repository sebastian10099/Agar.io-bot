name: New Token Bot

on:
  push:
    paths:
      - 'trading-bot/**'
      - '.github/workflows/trading-bot.yml'
  pull_request:
    paths:
      - 'trading-bot/**'
      - '.github/workflows/trading-bot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit-Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Tests ohne Anthropic-SDK
        working-directory: trading-bot
        run: python -W error::ResourceWarning -m unittest -v tests.test_bot tests.test_control tests.test_ai tests.test_sources tests.test_preflight
      - name: Tests mit Anthropic-SDK
        working-directory: trading-bot
        run: |
          python -m pip install --quiet anthropic certifi
          python -W error::ResourceWarning -m unittest tests.test_bot tests.test_control tests.test_ai tests.test_sources tests.test_preflight

  macos:
    name: macOS – Startskripte (bash 3.2), Apple-Python, echte Märkte
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Werkzeuge
        run: |
          /bin/bash --version | head -1
          /usr/bin/python3 --version || true
          ls /Library/Frameworks/Python.framework/Versions 2>/dev/null || true
      - name: Doppelklick-Starter ohne Argumente unter /bin/bash 3.2
        working-directory: trading-bot
        env:
          NEW_TOKEN_BOT_HOME: ${{ runner.temp }}/ntb-noargs
        run: |
          # exactly what Finder does: run the .command with no arguments (real mode, default port 8765)
          /bin/bash "./Start Trading Bot.command" > run.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -s -m 2 http://127.0.0.1:8765/api/state | grep -q '"app": "new-token-bot"'; then echo "läuft nach ${i}s"; break; fi
            sleep 1
          done
          cat run.log
          ! grep -q "unbound variable" run.log
          curl -s -m 5 http://127.0.0.1:8765/api/state | grep -q '"app": "new-token-bot"'
          curl -s -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8765/api/quit
      - name: Demo-Durchlauf über launch.sh
        working-directory: trading-bot
        env:
          NEW_TOKEN_BOT_HOME: ${{ runner.temp }}/ntb-demo
        run: /bin/bash ./launch.sh --demo --once
      - name: RugCheck-Rohantwort (Diagnose)
        continue-on-error: true
        run: |
          for host in api.rugcheck.xyz rugcheck.xyz; do
            echo "DNS $host: system=$(dig +short $host | head -3 | tr '\n' ' ') 1.1.1.1=$(dig +short @1.1.1.1 $host | head -3 | tr '\n' ' ') 8.8.8.8=$(dig +short @8.8.8.8 $host | head -3 | tr '\n' ' ')"
          done
          curl -sS -m 20 -o /dev/null -w 'https://rugcheck.xyz -> HTTP %{http_code}\n' https://rugcheck.xyz || true
          MINT=$(curl -s -m 20 https://api.dexscreener.com/token-profiles/latest/v1 | python3 -c "import json,sys; print(next(x['tokenAddress'] for x in json.load(sys.stdin) if x.get('chainId')=='solana'))")
          echo "Mint: $MINT"
          for UA in "new-token-bot/0.1" "Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/537.36 (KHTML, like Gecko) Safari/537.36"; do
            echo "--- User-Agent: $UA"
            curl -sS -m 20 -o rc.json -w 'HTTP %{http_code} in %{time_total}s\n' -H 'Accept: application/json' -H "User-Agent: $UA" \
              "https://api.rugcheck.xyz/v1/tokens/$MINT/report/summary" || true
            head -c 400 rc.json 2>/dev/null || echo "(keine Antwort)"; echo
          done
      - name: Bonding-Kurven-Rohdaten (Diagnose)
        working-directory: trading-bot
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, math, time
          from bot.sources.http import get_json
          from bot.sources import pumpfun
          K = 30 * 1.073e9          # pump.fun virtual SOL x virtual tokens at launch, whole units
          coins = get_json(pumpfun.URL, headers=pumpfun.HEADERS, retries=0)
          coins = coins if isinstance(coins, list) else (coins.get("coins") or coins.get("data") or [])
          print("pump.fun-Felder:", sorted(coins[0].keys()) if coins else "keine Coins")
          for c in coins[:10]:
              vs, vt, rs = c.get("virtual_sol_reserves"), c.get("virtual_token_reserves"), c.get("real_sol_reserves")
              k = vs * vt / 1e24 if vs and vt else None
              print(f"  {str(c.get('symbol'))[:10]:10s} vSOL={vs} vTok={vt} realSOL={rs} mcapSOL={c.get('market_cap')} mcapUSD={c.get('usd_market_cap')} complete={c.get('complete')} k/1e24={k}")
          mints = [c.get("mint") for c in coins if c.get("mint")]
          by_mint = {c.get("mint"): c for c in coins}
          pairs = get_json("https://api.dexscreener.com/tokens/v1/solana/" + ",".join(mints[:30])) or []
          print(f"DexScreener kennt {len({p['baseToken']['address'] for p in pairs})} von {min(30, len(mints))} frischen pump.fun-Coins")
          for p in pairs[:10]:
              native, usd = float(p.get("priceNative") or 0), float(p.get("priceUsd") or 0)
              v = math.sqrt(K * native) if native > 0 else 0
              sol_usd = usd / native if native > 0 else 0
              real = by_mint.get(p["baseToken"]["address"], {})
              print(f"  {p.get('dexId'):10s} {str(p['baseToken'].get('symbol'))[:10]:10s} liq={p.get('liquidity')} mcap={p.get('marketCap')} native={native:.3e} quote={p.get('quoteToken', {}).get('symbol')} labels={p.get('labels')} "
                    f"vSOL(Formel)={v:.1f} vSOL(pump.fun)={(real.get('virtual_sol_reserves') or 0) / 1e9:.1f} SOL=${sol_usd:,.0f} m5={p.get('txns', {}).get('m5')}")
          if pairs:
              raw = dict(pairs[0]); raw.pop("info", None)
              print("Ein DexScreener-Paar roh:", json.dumps(raw)[:900])
          done = [c for c in coins if c.get("complete")]
          if done:
              ps = get_json("https://api.dexscreener.com/tokens/v1/solana/" + done[0]["mint"]) or []
              print("Graduierter Coin", done[0].get("symbol"), "-> Paare:", [(p.get("dexId"), (p.get("liquidity") or {}).get("usd")) for p in ps])
          g = get_json("https://api.geckoterminal.com/api/v2/networks/solana/new_pools?page=1", headers={"Accept": "application/json;version=20230302"})
          print("GeckoTerminal neue Pools:")
          for pool in (g.get("data") or [])[:20]:
              a = pool["attributes"]; dex = pool["relationships"]["dex"]["data"]["id"]
              native = float(a.get("base_token_price_native_currency") or 0)
              v = math.sqrt(K * native) if native > 0 else 0
              print(f"  {dex:12s} {a.get('name', '')[:22]:22s} reserve={a.get('reserve_in_usd')} fdv={a.get('fdv_usd')} mcap={a.get('market_cap_usd')} native={native:.3e} quoteUSD={a.get('quote_token_price_usd')} "
                    f"vSOL(Formel)={v:.1f} m5={a.get('transactions', {}).get('m5')} vol5m={a.get('volume_usd', {}).get('m5')}")
          for c in coins[:50]:
              if c.get("quote_mint") and c.get("virtual_sol_reserves") and c.get("virtual_token_reserves"):
                  k = c["virtual_sol_reserves"] * c["virtual_token_reserves"] / 1e24
                  print(f"  Kurve {str(c.get('symbol'))[:10]:10s} quote={str(c.get('quote_mint'))[:6]} program={str(c.get('program'))[:6]} protocol={c.get('protocol')} decimals={c.get('base_decimals')}/{c.get('quote_decimals')} k/1e24={k:.3f}")
          # is DexScreener's pair the curve account, and what does the chain say about it?
          import base64, struct
          from bot.sources.http import post_json
          known = {p["baseToken"]["address"]: p for p in pairs}
          for c in [c for c in coins if c.get("mint") in known][:4]:
              ds = known[c["mint"]]
              acct = post_json("https://api.mainnet-beta.solana.com", {"jsonrpc": "2.0", "id": 1, "method": "getAccountInfo",
                               "params": [ds["pairAddress"], {"encoding": "base64"}]}, timeout=20).get("result", {}).get("value") or {}
              raw = base64.b64decode((acct.get("data") or [""])[0]) if acct else b""
              nums = struct.unpack_from("<5Q", raw, 8) if len(raw) >= 48 else ()
              print(f"  {str(c.get('symbol'))[:10]:10s} pump.fun bonding_curve={str(c.get('bonding_curve'))[:10]} DexScreener pair={ds['pairAddress'][:10]} gleich={c.get('bonding_curve') == ds['pairAddress']} "
                    f"owner={str(acct.get('owner'))[:10]} len={len(raw)} u64={nums} complete={raw[48] if len(raw) > 48 else None} pump.fun vSOL={c.get('virtual_sol_reserves')} vTok={c.get('virtual_token_reserves')}")
          # graduated coins: a new PumpSwap pool is a pump.fun curve that just completed
          grads = []
          for pool in g.get("data") or []:
              if pool["relationships"]["dex"]["data"]["id"] == "pumpswap":
                  grads.append(pool["relationships"]["base_token"]["data"]["id"].split("_", 1)[1])
          print("Graduierte Coins (neue PumpSwap-Pools):", grads[:3])
          for mint in grads[:3]:
              ps = get_json("https://api.dexscreener.com/tokens/v1/solana/" + mint) or []
              for p in ps:
                  print(f"  {mint[:8]} {p.get('dexId'):10s} pair={p.get('pairAddress', '')[:8]} liq={p.get('liquidity')} price={p.get('priceUsd')} m5={p.get('txns', {}).get('m5')} h1={p.get('txns', {}).get('h1')} labels={p.get('labels')} keys={sorted(set(p) - {'chainId', 'url', 'baseToken', 'quoteToken', 'info', 'txns', 'volume', 'priceChange'})}")
              try:
                  one = get_json(f"https://frontend-api-v3.pump.fun/coins/{mint}", headers=pumpfun.HEADERS, retries=0)
                  print(f"  pump.fun: complete={one.get('complete')} pool={one.get('pool_address') or one.get('raydium_pool')} vSOL={one.get('virtual_sol_reserves')}")
              except Exception as e:
                  print("  pump.fun Einzelabfrage:", type(e).__name__, str(e)[:120])
          PY
      - name: Ein echter Poll gegen die Live-Märkte
        working-directory: trading-bot
        continue-on-error: true
        env:
          NEW_TOKEN_BOT_HOME: ${{ runner.temp }}/ntb-live
        run: |
          time /bin/bash ./launch.sh --once
          echo "--- Warum fällt was durch (echte Marktdaten):"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from bot.store import Store
          s = Store(Path(os.environ["NEW_TOKEN_BOT_HOME"]) / "bot.sqlite")
          w = s.skip_reasons()
          print(json.dumps(w["decisions"]))
          for r in w["reasons"]:
              print(f"{r['n']:4d}  {r['share'] * 100:5.1f} %  {r['label']}")
          import statistics
          by = {}
          for c in s.candidates(500):
              by.setdefault(c["snapshot"].get("source") or "?", []).append(c)
          print("--- nach Quelle (Median):")
          for src, cs in sorted(by.items()):
              med = lambda k: statistics.median([float(c["snapshot"].get(k) or 0) for c in cs])
              liq_fail = sum(1 for c in cs if any("liquidity $" in r or "liquidity unknown" in r for r in c["reasons"]))
              kinds = {}
              for c in cs:
                  kinds[c["snapshot"].get("liquidity_kind")] = kinds.get(c["snapshot"].get("liquidity_kind"), 0) + 1
              dexes = sorted({str(c["snapshot"].get("dex")) for c in cs})
              print(f"  {src:14s} n={len(cs):3d}  Liq ${med('liquidity_usd'):,.0f}  Vol5m ${med('volume_m5'):,.0f}  Käufe5m {med('buys_m5'):.0f}  Alter {med('age_min'):.0f} min  an Liquidität gescheitert {liq_fail}  Liquidität: {kinds}  Dex: {', '.join(dexes)[:80]}")
          for c in [c for c in by.get("pumpfun", [])][:5]:
              sn = c["snapshot"]
              print(f"    pump.fun-Beispiel {c['symbol']!s:10.10s} dex={sn.get('dex')} liq={sn.get('liquidity_usd')} vol5m={sn.get('volume_m5')} buys5m={sn.get('buys_m5')} alter={sn.get('age_min')}")
          for c in s.candidates(200):
              if c["decision"] != "skip":
                  rug = (c["snapshot"].get("rug") or {})
                  print(f"  {c['decision']:5s} {c['symbol']!s:12.12s} score {c['score']}  Sicherheit: {rug.get('source', 'keine')}  {'; '.join(c['reasons'][:3])}")
          PY
      - name: Selbsttest gegen die echten Quellen (DexScreener, GeckoTerminal, pump.fun, RugCheck)
        working-directory: trading-bot
        env:
          NEW_TOKEN_BOT_HOME: ${{ runner.temp }}/ntb-live
        # informative: free APIs may rate-limit or block cloud IPs; the log shows each source's answer
        continue-on-error: true
        run: python3 -m bot.doctor
      - name: App-Installer und Launcher
        working-directory: trading-bot
        env:
          HOME: ${{ runner.temp }}/home
          NEW_TOKEN_BOT_HOME: ${{ runner.temp }}/ntb-app
          NEW_TOKEN_BOT_ARGS: --demo
          NEW_TOKEN_BOT_PORT: '8793'
          # exercise the no-Homebrew path: the macOS release zip of the Anthropic CLI
          NEW_TOKEN_BOT_ANT_ZIP: https://github.com/anthropics/anthropic-cli/releases/download/v1.42.0/ant_1.42.0_macos_arm64.zip
        run: |
          mkdir -p "$HOME/Desktop"
          /bin/bash ./install-app.sh < /dev/null
          APP="$HOME/Desktop/New Token Bot.app"
          test -x "$APP/Contents/MacOS/New Token Bot"
          plutil -lint "$APP/Contents/Info.plist"
          "$HOME/NewTokenBot/bin/ant" --version
          # the launcher starts the bot in the background and returns; never let a dialog hang the job
          LOG="$HOME/Library/Application Support/NewTokenBot/bot.log"
          perl -e 'alarm 300; exec @ARGV' /bin/bash -x "$APP/Contents/MacOS/New Token Bot" || { echo "--- Launcher-Fehler, bot.log:"; cat "$LOG" 2>/dev/null; exit 1; }
          curl -s -m 5 http://127.0.0.1:8793/api/state | grep -q '"app": "new-token-bot"' || { echo "--- bot.log:"; cat "$LOG"; exit 1; }
          echo "App-Launcher hat den Bot gestartet"
          echo "--- bot.log (Anfang):"; head -20 "$LOG" || true
          curl -s -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8793/api/quit
