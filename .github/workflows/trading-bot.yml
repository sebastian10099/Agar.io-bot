name: New Token Bot

on:
  push:
    paths:
      - 'trading-bot/**'
      - '.github/workflows/trading-bot.yml'
  pull_request:
    paths:
      - 'trading-bot/**'
      - '.github/workflows/trading-bot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit-Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Tests ohne Anthropic-SDK
        working-directory: trading-bot
        run: python -W error::ResourceWarning -m unittest -v tests.test_bot tests.test_control tests.test_ai tests.test_sources tests.test_preflight
      - name: Tests mit Anthropic-SDK
        working-directory: trading-bot
        run: |
          python -m pip install --quiet anthropic certifi
          python -W error::ResourceWarning -m unittest tests.test_bot tests.test_control tests.test_ai tests.test_sources tests.test_preflight

  vps:
    name: VPS – Installation als systemd-Dienst (Ubuntu), echte Märkte
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Installieren wie auf einem frischen Server
        run: sudo NTB_SOURCE="$GITHUB_WORKSPACE" bash trading-bot/deploy/vps-install.sh
      - name: Dienst läuft, nur lokal erreichbar, pollt die echten Märkte
        run: |
          state() { curl -s -m 5 http://127.0.0.1:8765/api/state; }
          systemctl is-active new-token-bot
          systemctl is-enabled new-token-bot
          state | python3 -c "import json,sys; s=json.load(sys.stdin); print(s['app'], s['mode'], 'update-Knopf', s['can_update'])"
          ss -ltn | grep ':8765'
          ip="$(hostname -I | awk '{print $1}')"
          if curl -s -m 3 "http://$ip:8765/api/state" > /dev/null; then echo "Steuerseite ist von außen erreichbar!"; exit 1; fi
          echo "von außen ($ip:8765) nicht erreichbar – gut"
          n=0
          for _ in $(seq 1 60); do
            n="$(state | python3 -c "import json,sys; print(json.load(sys.stdin)['polls'])")"
            [ "$n" -ge 2 ] && break
            sleep 2
          done
          echo "Polls: $n"; [ "$n" -ge 2 ]
          state | python3 -c "import json,sys; s=json.load(sys.stdin); print('Quellen:', [(x['name'], x['ok'], x['found']) for x in s['sources']]); print('Kandidaten:', s['stats']['candidates'])"
          sudo -u newtokenbot test -w /var/lib/new-token-bot/bot.sqlite
          if sudo -u newtokenbot test -w /opt/new-token-bot/src/bot/main.py; then echo "der Bot kann sein Programm ändern!"; exit 1; fi
          [ "$(sudo stat -c %a /etc/new-token-bot.env)" = 600 ]
      - name: Absturz → Neustart · Beenden → bleibt aus · erneut installieren → Konto bleibt
        run: |
          state() { curl -s -m 5 http://127.0.0.1:8765/api/state; }
          up() { for _ in $(seq 1 40); do state | grep -q '"app": "new-token-bot"' && return 0; sleep 1; done; return 1; }
          before="$(state | python3 -c "import json,sys; print(json.load(sys.stdin)['stats']['candidates'])")"
          sudo systemctl kill -s KILL new-token-bot
          sleep 2
          up && echo "nach dem Absturz neu gestartet"
          curl -s -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8765/api/quit
          sleep 10
          if systemctl is-active --quiet new-token-bot; then echo "läuft nach Beenden weiter"; exit 1; fi
          echo "Beenden hält ihn an"
          sudo NTB_SOURCE="$GITHUB_WORKSPACE" bash trading-bot/deploy/vps-install.sh > /dev/null
          up
          after="$(state | python3 -c "import json,sys; print(json.load(sys.stdin)['stats']['candidates'])")"
          echo "Kandidaten vorher $before, nach dem Update $after"
          [ "$after" -ge "$before" ]
      - name: Protokoll des Dienstes
        if: always()
        run: sudo journalctl -u new-token-bot -n 60 --no-pager

  macos:
    name: macOS – Startskripte (bash 3.2), Apple-Python, echte Märkte
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Werkzeuge
        run: |
          /bin/bash --version | head -1
          /usr/bin/python3 --version || true
          ls /Library/Frameworks/Python.framework/Versions 2>/dev/null || true
      - name: Doppelklick-Starter ohne Argumente unter /bin/bash 3.2
        working-directory: trading-bot
        env:
          NEW_TOKEN_BOT_HOME: ${{ runner.temp }}/ntb-noargs
        run: |
          # exactly what Finder does: run the .command with no arguments (real mode, default port 8765)
          /bin/bash "./Start Trading Bot.command" > run.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -s -m 2 http://127.0.0.1:8765/api/state | grep -q '"app": "new-token-bot"'; then echo "läuft nach ${i}s"; break; fi
            sleep 1
          done
          cat run.log
          if grep -q "unbound variable" run.log; then echo "unbound variable im Starter"; exit 1; fi
          if grep -q "Exception occurred" run.log; then echo "Server-Traceback"; exit 1; fi   # a client hanging up must not print one
          curl -s -m 5 http://127.0.0.1:8765/api/state | grep -q '"app": "new-token-bot"'
          curl -s -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8765/api/quit
      - name: Demo-Durchlauf über launch.sh
        working-directory: trading-bot
        env:
          NEW_TOKEN_BOT_HOME: ${{ runner.temp }}/ntb-demo
        run: /bin/bash ./launch.sh --demo --once
      - name: App-Installer und Launcher
        working-directory: trading-bot
        env:
          HOME: ${{ runner.temp }}/home
          NEW_TOKEN_BOT_HOME: ${{ runner.temp }}/ntb-app
          NEW_TOKEN_BOT_ARGS: --demo
          NEW_TOKEN_BOT_PORT: '8793'
          # exercise the no-Homebrew path: the macOS release zip of the Anthropic CLI
          NEW_TOKEN_BOT_ANT_ZIP: https://github.com/anthropics/anthropic-cli/releases/download/v1.42.0/ant_1.42.0_macos_arm64.zip
        run: |
          mkdir -p "$HOME/Desktop"
          /bin/bash ./install-app.sh < /dev/null
          APP="$HOME/Desktop/New Token Bot.app"
          test -x "$APP/Contents/MacOS/New Token Bot"
          plutil -lint "$APP/Contents/Info.plist"
          "$HOME/NewTokenBot/bin/ant" --version
          # the launcher starts the bot in the background and returns; never let a dialog hang the job
          LOG="$HOME/Library/Application Support/NewTokenBot/bot.log"
          perl -e 'alarm 300; exec @ARGV' /bin/bash -x "$APP/Contents/MacOS/New Token Bot" 2> launcher.trace || { echo "--- Launcher-Fehler:"; cat launcher.trace; cat "$LOG" 2>/dev/null; exit 1; }
          curl -s -m 5 http://127.0.0.1:8793/api/state | grep -q '"app": "new-token-bot"' || { echo "--- Launcher:"; cat launcher.trace; echo "--- bot.log:"; cat "$LOG"; exit 1; }
          echo "App-Launcher hat den Bot gestartet"
          echo "--- bot.log (Anfang):"; head -20 "$LOG" || true
          curl -s -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8793/api/quit
      - name: "Einzeiler aus der README: von GitHub laden, App auf den Schreibtisch, Doppelklick"
        env:
          HOME: ${{ runner.temp }}/home-get
          NEW_TOKEN_BOT_HOME: ${{ runner.temp }}/ntb-get
          NEW_TOKEN_BOT_ARGS: --demo
          NEW_TOKEN_BOT_PORT: '8794'
          NEW_TOKEN_BOT_ANT_ZIP: https://github.com/anthropics/anthropic-cli/releases/download/v1.42.0/ant_1.42.0_macos_arm64.zip
        run: |
          mkdir -p "$HOME/Desktop"
          # the exact command the README gives, unchanged - it fetches the branch as pushed
          curl -fsSL https://raw.githubusercontent.com/sebastian10099/Agar.io-bot/claude/agenen-funktionalitaet-hnw6g5/trading-bot/get.sh | bash
          APP="$HOME/Desktop/New Token Bot.app"
          test -x "$APP/Contents/MacOS/New Token Bot"
          test "$(cat "$APP/Contents/Resources/project.path")" = "$HOME/NewTokenBot/src"
          test -f "$HOME/NewTokenBot/src/bot/main.py"
          LOG="$HOME/Library/Application Support/NewTokenBot/bot.log"
          perl -e 'alarm 300; exec @ARGV' /bin/bash "$APP/Contents/MacOS/New Token Bot" || { cat "$LOG" 2>/dev/null; exit 1; }
          curl -s -m 5 http://127.0.0.1:8794/api/state | grep -q '"app": "new-token-bot"' || { cat "$LOG"; exit 1; }
          echo "Einzeiler: App vom Schreibtisch hat den Bot gestartet"
          # the double click fetched the newest version first (installed with get.sh)
          cat "$HOME/Library/Application Support/NewTokenBot/update.log"
          grep -q "^aktuell" "$HOME/Library/Application Support/NewTokenBot/update.log"
          test -f "$HOME/NewTokenBot/src/bot/main.py"
          # the Paper-Live test inside the app, sandboxed
          curl -s -m 20 -D live.head -o live.html http://127.0.0.1:8794/live
          grep -qi "content-security-policy: sandbox" live.head
          grep -q "zurück zur Steuerung" live.html
          grep -q "Paper-Live" live.html && echo "Paper-Live-Seite in der App: ok" || echo "Paper-Live-Seite: GitHub nicht erreichbar (Hinweis angezeigt)"
          curl -s -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8794/api/quit
      - name: "Heruntergeladene App auf einem frischen Mac: richtet sich beim ersten Öffnen selbst ein"
        working-directory: trading-bot
        env:
          HOME: ${{ runner.temp }}/home-dl
          NEW_TOKEN_BOT_HOME: ${{ runner.temp }}/ntb-dl
          NEW_TOKEN_BOT_ARGS: --demo
          NEW_TOKEN_BOT_PORT: '8796'
        run: |
          mkdir -p "$HOME/Desktop"
          # what the zip holds: the bundle alone, no project.path, nothing installed
          ditto -c -k --keepParent "New Token Bot.app" "$RUNNER_TEMP/New Token Bot.zip"
          ditto -x -k "$RUNNER_TEMP/New Token Bot.zip" "$HOME/Desktop"
          APP="$HOME/Desktop/New Token Bot.app"
          test ! -e "$APP/Contents/Resources/project.path"
          test -x "$APP/Contents/MacOS/New Token Bot"
          LOG="$HOME/Library/Application Support/NewTokenBot/bot.log"
          perl -e 'alarm 400; exec @ARGV' /bin/bash "$APP/Contents/MacOS/New Token Bot" || { cat "$HOME/Library/Application Support/NewTokenBot/update.log"; cat "$LOG" 2>/dev/null; exit 1; }
          curl -s -m 5 http://127.0.0.1:8796/api/state | grep -q '"app": "new-token-bot"' || { cat "$LOG"; exit 1; }
          cat "$HOME/Library/Application Support/NewTokenBot/update.log"
          grep -q "Erste Einrichtung" "$HOME/Library/Application Support/NewTokenBot/update.log"
          test -s "$HOME/NewTokenBot/src/.version"
          echo "Heruntergeladene App: Bot eingerichtet und gestartet, Version $(cut -c1-7 "$HOME/NewTokenBot/src/.version")"
          curl -s -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8796/api/quit
      - name: RugCheck erreichbar? (Diagnose)
        continue-on-error: true
        run: |
          echo "DNS api.rugcheck.xyz: system=$(dig +short api.rugcheck.xyz | head -1) 1.1.1.1=$(dig +short @1.1.1.1 api.rugcheck.xyz | head -1)"
          curl -sS -m 20 -o /dev/null -w 'https://api.rugcheck.xyz -> HTTP %{http_code}\n' https://api.rugcheck.xyz/v1/stats/recent || true
          # creator check on live pump.fun coins: curve address = DexScreener's pair, creator at bytes 49-81,
          # and the derived token account really belongs to the creator and the coin
          (cd trading-bot && python3 - <<'PY'
          import json, urllib.request
          from bot.sources.solana_rpc import OnChainCheck, PUMP_PROGRAM, assess_mint, b58decode, find_program_address
          get = lambda u: json.load(urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "new-token-bot/0.1"}), timeout=20))
          mints = [x["tokenAddress"] for x in get("https://api.dexscreener.com/token-profiles/latest/v1") if x.get("chainId") == "solana" and x["tokenAddress"].endswith("pump")][:3]
          # and the fresh launches the bot actually trades (GeckoTerminal's newest pump.fun pools)
          fresh = get("https://api.geckoterminal.com/api/v2/networks/solana/new_pools?include=base_token")
          mints += [t["attributes"]["address"] for t in fresh.get("included", []) if t["attributes"]["address"].endswith("pump")][:8]
          pairs = {p["baseToken"]["address"]: p for p in get("https://api.dexscreener.com/tokens/v1/solana/" + ",".join(mints)) if p.get("dexId") == "pumpfun"}
          oc = OnChainCheck()
          for mint in mints:
              curve = find_program_address([b"bonding-curve", b58decode(mint)], PUMP_PROGRAM)
              info = assess_mint(oc._rpc("getAccountInfo", [mint, {"encoding": "jsonParsed"}]))
              c = oc.creator_share(mint, info and info["program"], info and info["supply_raw"] or 0)
              import base64
              from bot.sources.solana_rpc import b58encode, on_curve
              raw = oc._rpc("getAccountInfo", [curve, {"encoding": "base64"}])
              data = base64.b64decode(raw["data"][0]) if raw else b""
              who = b58encode(data[49:81]) if len(data) >= 81 else None
              if who and on_curve(who) is False:     # fee sharing: the curve names pump.fun's fee account
                  from bot.sources.solana_rpc import parse_fee_sharing
                  acc = oc._rpc("getAccountInfo", [who, {"encoding": "base64"}])
                  blob = base64.b64decode(acc["data"][0]) if acc else b""
                  print(f"  {mint[:8]} Gebührenkonto {who[:8]}: owner {acc and acc.get('owner')}, {len(blob)} Bytes, "
                        f"gelesen: {parse_fee_sharing(blob, mint) if blob else '-'}" + ("" if not blob or parse_fee_sharing(blob, mint) else f", Bytes 43-160 {blob[43:160].hex()}"))
              line = f"{mint[:8]} Kurve {'= DexScreener' if mint not in pairs else ('= DexScreener-Paar' if pairs[mint]['pairAddress'] == curve else 'ABWEICHUNG ' + pairs[mint]['pairAddress'])} · {info and info['program']} · Ersteller {c}"
              if c:
                  from bot.sources.solana_rpc import ATA_PROGRAM, TOKEN_PROGRAMS
                  ata = find_program_address([b58decode(c["creator"]), b58decode(TOKEN_PROGRAMS[info["program"]]), b58decode(mint)], ATA_PROGRAM)
                  acc = oc._rpc("getAccountInfo", [ata, {"encoding": "jsonParsed"}])
                  parsed = ((acc or {}).get("data") or {}).get("parsed", {}).get("info", {}) if acc else {}
                  line += f" · Konto {'gehört dem Ersteller' if parsed.get('owner') == c['creator'] and parsed.get('mint') == mint else ('fehlt (verkauft/nie gekauft)' if acc is None else 'FALSCH ' + str(parsed)[:120])}"
              print(line)
          PY
          ) || echo "Ersteller-Probe fehlgeschlagen"
          # DNS over HTTPS bypasses the runner's resolver: Status 3 = the name does not exist anywhere
          for host in api.rugcheck.xyz rugcheck.xyz; do
            echo "DoH $host: $(curl -s -m 15 -H 'accept: application/dns-json' "https://cloudflare-dns.com/dns-query?name=$host&type=A" | head -c 300)"
          done
      - name: Kursseiten-Links (Diagnose)
        continue-on-error: true
        run: |
          # which page does a link of the control page open? pump.fun curve tokens link to pump.fun/coin/<mint>
          python3 - <<'PY'
          import json, urllib.request
          pairs = json.load(urllib.request.urlopen(urllib.request.Request("https://api.dexscreener.com/token-profiles/latest/v1", headers={"User-Agent": "new-token-bot/0.1"}), timeout=20))
          mints = [p["tokenAddress"] for p in pairs if p.get("chainId") == "solana" and p["tokenAddress"].endswith("pump")][:2]
          info = json.load(urllib.request.urlopen(urllib.request.Request("https://api.dexscreener.com/tokens/v1/solana/" + ",".join(mints), headers={"User-Agent": "new-token-bot/0.1"}), timeout=20))
          for p in info[:2]:
              for url in (f"https://pump.fun/coin/{p['baseToken']['address']}", p.get("url"), f"https://dexscreener.com/solana/{p['baseToken']['address']}"):
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/537.36 (KHTML, like Gecko) Safari/537.36", "Accept": "text/html"})
                  try:
                      with urllib.request.urlopen(req, timeout=20) as r:
                          body = r.read(200000).decode("utf-8", "replace")
                          print(f"  {r.status} {url} -> {r.geturl()} · {'not found' if 'not found' in body.lower() else 'Seite'} · {p['dexId']}")
                  except Exception as e:
                      print(f"  {type(e).__name__} {getattr(e, 'code', '')} {url}")
          PY
      - name: Kurse direkt von der Chain (PumpSwap-Pools) gegen DexScreener
        working-directory: trading-bot
        run: |
          # the pool layout (vaults at bytes 139-203) and the decimals, checked on live pools: the chain's
          # price this second must agree with DexScreener's (up to half a minute old) within reason
          python3 - <<'PY'
          import statistics, sys
          from bot.sources.curve import CurveReader
          from bot.sources.dexscreener import DexScreener
          dex = DexScreener()
          tokens = dex.recent_token_addresses(["solana"])["solana"][:90]
          pools = [n for n in dex._token_pairs("solana", tokens) if n["dex"] == "pumpswap"][:12]
          import time
          from bot.sources.http import post_json
          from bot.sources.solana_rpc import rpc_urls
          for url in rpc_urls():                  # every endpoint the readers rotate through answers ordinary calls
              try:
                  slot = post_json(url, {"jsonrpc": "2.0", "id": 1, "method": "getSlot"}, timeout=10).get("result")
                  print(f"Knoten {url}: Slot {slot}")
              except Exception as e:
                  print(f"Knoten {url}: {type(e).__name__} {str(e)[:80]}")
          reader = CurveReader()
          got = {}
          for attempt in range(4):                # the public node limits shared runner addresses: try again
              got = reader.pool_prices({n["pair"]: n["token"] for n in pools}, dex.quote_usd)
              if got:
                  break
              time.sleep(5 + 5 * attempt); reader._paused_until = 0.0
          print(f"SOL laut DexScreener: {dex.quote_usd.get('So11111111111111111111111111111111111111112')} $ · {len(pools)} PumpSwap-Pools · RPC-Aufrufe {reader.calls}, Fehler {reader.fails} {reader.last_error}")
          from bot.sources.curve import token_amount
          devs = []
          sol = dex.quote_usd.get('So11111111111111111111111111111111111111112') or 0
          for n in pools:
              chain = got.get(n["pair"])
              dev = (chain / n["price_usd"] - 1) * 100 if chain and n["price_usd"] else None
              if dev is not None:
                  devs.append(dev)
              print(f"  {n['symbol']!s:>12} {n['pair'][:8]} Reserven {n['price_usd']:.6g} (letzter Trade {n['price_last_usd']:.6g})"
                    f" · Chain {chain if chain is None else f'{chain:.6g}'}" + ("" if dev is None else f" · {dev:+.1f} %"))
              # where does a gap come from: DexScreener's own reserves, the vaults, the pool's activity
              pool = reader._pools.get(n["pair"])
              raw = n.get("liquidity_base_usd"), n.get("liquidity_quote_usd")
              line = (f"      Alter {n['age_min'] or 0:.0f} min · m5 {n['buys_m5']}/{n['sells_m5']} Trades, Vol {n['volume_m5']:.0f} $ · "
                      f"DS-Liq {n['liquidity_reported_usd']:.0f} $ (Basis {raw[0] or 0:.0f} $, Gegenseite {raw[1] or 0:.0f} $)")
              if pool:
                  acc = reader._accounts([pool["base_vault"], pool["quote_vault"]])
                  b = token_amount(acc[pool["base_vault"]][1]) / 10 ** pool["base_decimals"] if acc.get(pool["base_vault"]) else None
                  q = token_amount(acc[pool["quote_vault"]][1]) / 10 ** pool["quote_decimals"] if acc.get(pool["quote_vault"]) else None
                  line += f" · Tresore {b} Token / {q} SOL (Dez. {pool['base_decimals']}/{pool['quote_decimals']})"
                  if raw[0] and n["price_usd"] and sol:
                      line += f" · DS-Reserven {raw[0] / n['price_usd']:.0f} Token / {(raw[1] or 0) / sol:.2f} SOL"
              print(line)
          if len(pools) >= 3 and not got and reader.fails == 0:
              sys.exit("kein einziger Pool von der Chain gelesen – Layout oder Dezimalstellen stimmen nicht")
          # the bot's price is the reserves' (DexScreener's reserve figures); a quiet pool's reserves stand
          # still for DexScreener's half minute, so there the chain must agree to the percent
          quiet = [abs(got[n["pair"]] / n["price_usd"] - 1) * 100 for n in pools
                   if got.get(n["pair"]) and n["price_usd"] and n["buys_m5"] + n["sells_m5"] < 20]
          if quiet and statistics.median(quiet) > 5:
              sys.exit(f"ruhige Pools: Chain und Reserven laut DexScreener weichen im Median um {statistics.median(quiet):.1f} % ab – Layout prüfen")
          print(f"{len(devs)} von {len(pools)} Pools von der Chain bepreist" + (f", Abweichung im Median {statistics.median(abs(d) for d in devs):.1f} %" if devs else "")
                + (f", ruhige Pools {statistics.median(quiet):.2f} %" if quiet else ""))
          PY
      - name: RugCheck-Bericht – Halter ohne Pools (Diagnose)
        working-directory: trading-bot
        continue-on-error: true
        run: |
          # the full report's holder list: pools and lockers must drop out, or a pool reads as a whale
          python3 - <<'PY'
          from bot.sources.dexscreener import DexScreener
          from bot.sources.http import get_json
          from bot.sources.rugcheck import BASE, parse_report
          dex = DexScreener()
          pools = [n for n in dex._token_pairs("solana", dex.recent_token_addresses(["solana"])["solana"][:60]) if n["dex"] == "pumpswap"][:4]
          for n in pools:
              try:
                  rep = get_json(f"{BASE}/tokens/{n['token']}/report", timeout=20, retries=1)
              except Exception as e:
                  print(f"{n['symbol']}: {type(e).__name__} {str(e)[:80]}"); continue
              known = {a: (i or {}).get("type") for a, i in (rep.get("knownAccounts") or {}).items()}
              print(f"{n['symbol']} {n['token'][:8]} · Schlüssel: {sorted(rep)[:40]}")
              print(f"   markets: {[{k: (str(v)[:10] if not isinstance(v, dict) else sorted(v)[:6]) for k, v in m.items()} for m in (rep.get('markets') or [])[:1]]}")
              print(f"   knownAccounts: {[(a[:6], t) for a, t in list(known.items())[:6]]}")
              for h in (rep.get("topHolders") or [])[:5]:
                  print(f"   Halter {str(h.get('address'))[:6]} Besitzer {str(h.get('owner'))[:6]} {h.get('pct')} % insider={h.get('insider')} "
                        f"bekannt={known.get(h.get('owner')) or known.get(h.get('address'))}")
              r = parse_report(rep)
              print(f"   -> holders {r.get('holders')} · insider_wallets {r.get('insider_wallets')} · creator {r.get('creator_pct')} % · "
                    f"lp_locked {r.get('lp_locked_pct')} · danger {r['danger']} · warn {r['warn'][:3]}")
          PY
      - name: pump.fun über den PumpPortal-Datenstrom (von einer Rechenzentrums-Adresse)
        working-directory: trading-bot
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, time
          from bot.sources.pumpportal import HOST, PATH, SUBSCRIBE, WebSocket
          ws = WebSocket(HOST, PATH)
          for m in SUBSCRIBE:
              ws.send(json.dumps(m))
          kinds, end, first = {}, time.time() + 40, None
          while time.time() < end and sum(kinds.values()) < 30:
              msg = json.loads(ws.recv())
              k = msg.get("txType") or ("Bestätigung" if "message" in msg else "?")
              kinds[k] = kinds.get(k, 0) + 1
              if first is None and msg.get("mint"):
                  first = {key: msg.get(key) for key in ("txType", "mint", "symbol", "pool")}
          ws.close()
          print(f"Ereignisse in {40 - max(0, end - time.time()):.0f} s: {kinds} · z. B. {first}")
          assert sum(v for k, v in kinds.items() if k != "Bestätigung") > 0, "keine Coins im Datenstrom"
          PY
      - name: Ein echter Poll gegen die Live-Märkte
