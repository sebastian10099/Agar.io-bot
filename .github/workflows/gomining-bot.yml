name: GoMining Bot (macOS-App)

on:
  push:
    paths:
      - 'GoMiningBot/**'
      - '.github/workflows/gomining-bot.yml'
  pull_request:
    paths:
      - 'GoMiningBot/**'
      - '.github/workflows/gomining-bot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Unit-Tests
        working-directory: GoMiningBot
        run: swift test

      - name: App bauen (universal, ad-hoc signiert)
        working-directory: GoMiningBot
        env:
          APP_BUILD: ${{ github.run_number }}
        run: ./build_app.sh

      - name: App-Bundle prüfen
        working-directory: GoMiningBot/dist
        run: |
          ls -la
          codesign -dv "GoMining Bot Pro.app" 2>&1 | head -5
          lipo -info "GoMining Bot Pro.app/Contents/MacOS/GoMiningBotPro"
          # Eigene Identitaet, damit macOS die App nicht mit der alten "GoMining Bot" 3.9 verwechselt.
          ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "GoMining Bot Pro.app/Contents/Info.plist")"
          echo "Bundle-ID: $ID"
          [ "$ID" = "com.sebastian.gominingbot.pro" ]
          unzip -l GoMining-Bot.zip | grep -q "GoMining Bot Pro.app/Contents/MacOS/GoMiningBotPro"

      - name: Rauchtest (App starten, 25 s Live-Daten von BingX prüfen)
        continue-on-error: true
        working-directory: GoMiningBot
        run: |
          export GOMINING_DATA_DIR="$RUNNER_TEMP/gomining-data"
          export GOMINING_SMOKE_OUT="$PWD/smoke-report.txt"
          export GOMINING_SMOKE_SHOTS="$PWD/smoke-shots"
          rm -rf "$GOMINING_SMOKE_OUT" "$GOMINING_SMOKE_SHOTS"
          "dist/GoMining Bot Pro.app/Contents/MacOS/GoMiningBotPro" > "$RUNNER_TEMP/app.log" 2>&1 &
          APP_PID=$!
          for i in $(seq 1 240); do
            [ -f "$GOMINING_SMOKE_OUT" ] && break
            kill -0 $APP_PID 2>/dev/null || break
            sleep 1
          done
          echo "---- Bericht der App ----"
          cat "$GOMINING_SMOKE_OUT" 2>/dev/null || echo "(kein Bericht - die App ist vorzeitig beendet)"
          echo "---- Ausgabe der App (letzte Zeilen) ----"
          tail -n 30 "$RUNNER_TEMP/app.log" || true
          kill $APP_PID 2>/dev/null || true
          [ -f "$GOMINING_SMOKE_OUT" ]

      - name: Bilder verkleinern
        if: always()
        working-directory: GoMiningBot
        run: |
          ls -la smoke-shots 2>/dev/null || echo "(keine Bilder)"
          for f in smoke-shots/*.png; do [ -f "$f" ] && sips -Z 1500 "$f" >/dev/null; done || true
          ls -la smoke-shots 2>/dev/null || true

      - name: Bilder ins Repository übernehmen (nur bei [shots] in der Commit-Nachricht)
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[shots]')
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p GoMiningBot/docs/screens
          cp GoMiningBot/smoke-shots/*.png GoMiningBot/docs/screens/
          git add GoMiningBot/docs/screens
          if git diff --cached --quiet; then echo "keine Änderungen"; exit 0; fi
          git commit -m "CI: Bilder der Oberfläche aktualisiert [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Bilder der Oberfläche hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GoMining-Bot-Bilder
          path: GoMiningBot/smoke-shots
          if-no-files-found: ignore
          retention-days: 7

      - name: ZIP hochladen
        uses: actions/upload-artifact@v4
        with:
          name: GoMining-Bot-macOS
          path: GoMiningBot/dist/GoMining-Bot.zip
          if-no-files-found: error
          retention-days: 30

  # Neue Versionsnummer in GoMiningBot/VERSION => automatisch ein GitHub-Release mit der fertigen App.
  # Zwischenstaende mit "[no-release]" in der Commit-Nachricht werden nicht veroeffentlicht.
  # Fester Download-Link fuer die jeweils neueste Version:
  # https://github.com/sebastian10099/Agar.io-bot/releases/latest/download/GoMining-Bot.zip
  release:
    needs: build
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[no-release]') && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/claude/friendly-goldberg-31l8fp')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GoMining-Bot-macOS
          path: dist
      - name: Release veröffentlichen (nur wenn die Version neu ist)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d ' \n\r' < GoMiningBot/VERSION)"
          TAG="gomining-bot-v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG gibt es schon - nichts zu tun."
            exit 0
          fi
          awk -v v="$VERSION" '/^## / { if (found) exit; if ($2 == v) { found = 1; next } } found { print }' GoMiningBot/CHANGELOG.md > notes.md
          {
            echo ""
            echo "---"
            echo "**Installation (am einfachsten):** Programm *Terminal* öffnen, diese Zeile einfügen und Enter drücken – die App landet auf dem Desktop und startet (eine vorhandene „GoMining Bot Pro“ wird ersetzt, eine alte „GoMining Bot“-App bleibt unberührt):"
            echo ""
            echo '```bash'
            echo 'pkill -x GoMiningBotPro; T="$(mktemp -d)" && curl -fL -o "$T/app.zip" https://github.com/sebastian10099/Agar.io-bot/releases/latest/download/GoMining-Bot.zip && ditto -x -k "$T/app.zip" "$T" && rm -rf ~/Desktop/"GoMining Bot Pro.app" && mv "$T/GoMining Bot Pro.app" ~/Desktop/ && { xattr -cr ~/Desktop/"GoMining Bot Pro.app"; open ~/Desktop/"GoMining Bot Pro.app"; }'
            echo '```'
            echo ""
            echo "Per Browser geladen? Die App ist nicht notarisiert (kein Apple-Entwicklerkonto), macOS bietet deshalb nur *In den Papierkorb legen* an. Dann: *Fertig* klicken → *Systemeinstellungen → Datenschutz & Sicherheit* → ganz unten *Dennoch öffnen* → mit Passwort bestätigen."
            echo ""
            echo "Ab Version 4.1 findet die App neue Versionen selbst und aktualisiert sich auf Knopfdruck – ohne diese Abfrage."
          } >> notes.md
          gh release create "$TAG" dist/GoMining-Bot.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "GoMining Bot $VERSION" --notes-file notes.md --latest
