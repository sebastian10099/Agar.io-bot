name: GoMining Bot (macOS-App)

on:
  push:
    paths:
      - 'GoMiningBot/**'
      - '.github/workflows/gomining-bot.yml'
  pull_request:
    paths:
      - 'GoMiningBot/**'
      - '.github/workflows/gomining-bot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Unit-Tests
        working-directory: GoMiningBot
        run: swift test

      - name: App bauen (universal, ad-hoc signiert)
        working-directory: GoMiningBot
        env:
          APP_VERSION: '4.0'
          APP_BUILD: ${{ github.run_number }}
        run: ./build_app.sh

      - name: App-Bundle prüfen
        working-directory: GoMiningBot/dist
        run: |
          ls -la
          codesign -dv "GoMining Bot.app" 2>&1 | head -5
          lipo -info "GoMining Bot.app/Contents/MacOS/GoMiningBot"

      - name: Rauchtest (App starten, 25 s Live-Daten von BingX prüfen)
        continue-on-error: true
        working-directory: GoMiningBot
        run: |
          export GOMINING_DATA_DIR="$RUNNER_TEMP/gomining-data"
          export GOMINING_SMOKE_OUT="$PWD/smoke-report.txt"
          export GOMINING_SMOKE_SHOTS="$PWD/smoke-shots"
          rm -rf "$GOMINING_SMOKE_OUT" "$GOMINING_SMOKE_SHOTS"
          "dist/GoMining Bot.app/Contents/MacOS/GoMiningBot" > "$RUNNER_TEMP/app.log" 2>&1 &
          APP_PID=$!
          for i in $(seq 1 240); do
            [ -f "$GOMINING_SMOKE_OUT" ] && break
            kill -0 $APP_PID 2>/dev/null || break
            sleep 1
          done
          echo "---- Bericht der App ----"
          cat "$GOMINING_SMOKE_OUT" 2>/dev/null || echo "(kein Bericht - die App ist vorzeitig beendet)"
          echo "---- Ausgabe der App (letzte Zeilen) ----"
          tail -n 30 "$RUNNER_TEMP/app.log" || true
          kill $APP_PID 2>/dev/null || true
          [ -f "$GOMINING_SMOKE_OUT" ]

      - name: Bilder verkleinern
        if: always()
        working-directory: GoMiningBot
        run: |
          ls -la smoke-shots 2>/dev/null || echo "(keine Bilder)"
          for f in smoke-shots/*.png; do [ -f "$f" ] && sips -Z 1500 "$f" >/dev/null; done || true
          ls -la smoke-shots 2>/dev/null || true

      - name: Bilder ins Repository übernehmen (nur bei [shots] in der Commit-Nachricht)
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[shots]')
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p GoMiningBot/docs/screens
          cp GoMiningBot/smoke-shots/*.png GoMiningBot/docs/screens/
          git add GoMiningBot/docs/screens
          if git diff --cached --quiet; then echo "keine Änderungen"; exit 0; fi
          git commit -m "CI: Bilder der Oberfläche aktualisiert [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Bilder der Oberfläche hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GoMining-Bot-Bilder
          path: GoMiningBot/smoke-shots
          if-no-files-found: ignore
          retention-days: 7

      - name: ZIP hochladen
        uses: actions/upload-artifact@v4
        with:
          name: GoMining-Bot-macOS
          path: GoMiningBot/dist/GoMining-Bot.zip
          if-no-files-found: error
          retention-days: 30

  # Bei einem Tag "gomining-bot-v*" (z. B. gomining-bot-v4.0) wird die fertige App als GitHub-Release
  # veroeffentlicht und ist dann ohne Anmeldung herunterladbar.
  release:
    if: startsWith(github.ref, 'refs/tags/gomining-bot-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GoMining-Bot-macOS
      - name: Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" GoMining-Bot.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "GoMining Bot ${GITHUB_REF_NAME#gomining-bot-v}" \
            --notes "Fertig gebaute App (Apple Silicon + Intel, nicht notarisiert). Erster Start: Rechtsklick auf die App, dann Öffnen. Details: GoMiningBot/README.md"
