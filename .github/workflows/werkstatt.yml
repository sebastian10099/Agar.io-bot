name: BeamNet-Werkstatt (lokale KI)

on:
  push:
    paths:
      - 'BeamNet/werkstatt/**'
      - 'BeamNet/tests/run_lua_tests.py'
      - '.github/workflows/werkstatt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install lupa
      - name: Tests (nachgebaute KI, echtes Git)
        run: python3 BeamNet/werkstatt/test_werkstatt.py

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            file: BeamNet-Werkstatt-Windows.exe
          - os: macos-14
            file: BeamNet-Werkstatt-Mac.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller lupa
      - name: Bauen
        shell: bash
        run: |
          cd BeamNet/werkstatt
          pyinstaller --onefile --console --name BeamNet-Werkstatt --collect-all lupa werkstatt.py
      - name: Fertiges Programm pruefen (Version und eingebaute Plugin-Tests)
        shell: bash
        run: |
          EXE=BeamNet/werkstatt/dist/BeamNet-Werkstatt
          [[ -f $EXE.exe ]] && EXE=$EXE.exe
          "$EXE" --version
          # Die eingebauten Plugin-Tests brauchen Linux/Mac-Befehle; unter Windows nur Start und Version pruefen.
          if [[ "${{ matrix.os }}" != windows-latest ]]; then "$EXE" --selbsttest .; fi
      - name: Verpacken
        shell: bash
        run: |
          mkdir -p out
          if [[ "${{ matrix.os }}" == windows-latest ]]; then
            cp BeamNet/werkstatt/dist/BeamNet-Werkstatt.exe "out/${{ matrix.file }}"
          else
            # Mac-App: Doppelklick oeffnet ein Terminal-Fenster mit der Werkstatt.
            APP="out/BeamNet Werkstatt.app"
            mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
            cp BeamNet/werkstatt/dist/BeamNet-Werkstatt "$APP/Contents/Resources/BeamNet-Werkstatt"
            cp BeamNet/werkstatt/mac-start.sh "$APP/Contents/MacOS/BeamNetWerkstatt"
            chmod +x "$APP/Contents/MacOS/BeamNetWerkstatt" "$APP/Contents/Resources/BeamNet-Werkstatt"
            VERSION="$(tr -d ' \n\r' < BeamNet/werkstatt/VERSION)"
            sed "s/__VERSION__/$VERSION/" BeamNet/werkstatt/Info.plist > "$APP/Contents/Info.plist"
            (cd out && ditto -c -k --sequesterRsrc --keepParent "BeamNet Werkstatt.app" "${{ matrix.file }}")
            # Pruefen, dass die App vollstaendig ist.
            unzip -l "out/${{ matrix.file }}" | grep -q "Contents/Resources/BeamNet-Werkstatt"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: out/${{ matrix.file }}

  # Fester Download-Link (ueberschreibt nicht das "neueste Release" des GoMining Bots):
  # https://github.com/sebastian10099/Agar.io-bot/releases/download/werkstatt/BeamNet-Werkstatt-Windows.exe
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/claude/friendly-goldberg-31l8fp'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Veroeffentlichen (nur bei neuer Version)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d ' \n\r' < BeamNet/werkstatt/VERSION)"
          TITLE="BeamNet-Werkstatt $VERSION"
          if [[ "$(gh release view werkstatt --repo "$GITHUB_REPOSITORY" --json name -q .name 2>/dev/null)" == "$TITLE" ]]; then
            echo "$TITLE ist schon veroeffentlicht."
            exit 0
          fi
          gh release delete werkstatt --repo "$GITHUB_REPOSITORY" --cleanup-tag -y 2>/dev/null || true
          cat > notes.md <<'NOTES'
          **BeamNet-Werkstatt** – deine lokale KI arbeitet die Aufgaben von Claude ab, Claude prüft nur noch.

          - Windows: `BeamNet-Werkstatt-Windows.exe` laden und doppelklicken (Windows fragt beim ersten Mal: *Weitere Informationen → Trotzdem ausführen*).
          - Mac (am einfachsten): Programm *Terminal* öffnen, diese Zeile einfügen und Enter drücken – die App landet auf dem Schreibtisch und startet:

          ```bash
          T="$(mktemp -d)" && curl -fL -o "$T/w.zip" https://github.com/sebastian10099/Agar.io-bot/releases/download/werkstatt/BeamNet-Werkstatt-Mac.zip && ditto -x -k "$T/w.zip" "$T" && rm -rf ~/Desktop/"BeamNet Werkstatt.app" && mv "$T/BeamNet Werkstatt.app" ~/Desktop/ && xattr -cr ~/Desktop/"BeamNet Werkstatt.app" && open ~/Desktop/"BeamNet Werkstatt.app"
          ```
          - Voraussetzungen: Git und Ollama (oder LM Studio) mit einem Code-Modell, z. B. `ollama pull qwen3-coder:30b`.

          Anleitung: BeamNet/werkstatt/README.md im Projekt.
          NOTES
          sed -i 's/^          //' notes.md
          gh release create werkstatt dist/BeamNet-Werkstatt-Windows.exe dist/BeamNet-Werkstatt-Mac.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TITLE" --notes-file notes.md --latest=false
